# 标准模型实例假设元数据

instance_name: Standard Model fermion mass spectrum
source: sm_mass_complete_v5.py
layer: model_hypothesis

clifford_signature: [1, 7]
gauge_group: SU(3)_C x SU(2)_L x U(1)_Y

orbit_functor:
  up: 1.0
  down: 1.0
  lepton: 3.0
  neutrino: 1.0
  comment: q_up : q_down : q_lepton = 1 : 1 : 3 from SU(3)_C Weyl orbit

key_assumptions:
  - Higgs VEV v = 246 GeV anchors the top mass.
  - Three-generation Yukawa hierarchy arises from fractal spectral recursion.
  - Sector weights are determined by Cl(1,7) / Pati-Salam algebraic constraints.

framework_interfaces:
  rec_object: sm_instance.SMInstance.to_rec_object
  spectral_object: sm_instance.SMInstance.to_spectral_object
  orbit_weight: orbit_functor.OrbitFunctor.on_sm_fermion

validation_tests:
  - test_sm_instance.py
